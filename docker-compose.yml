services:
  nginx:
    image: ${HOME_PAGE_IMAGE}
    container_name: home_page_nginx
    # Sem portas publicadas: o Traefik (rede "proxy") recebe 80/443 e encaminha.
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.home-page.rule=Host(`antaresprime.com`) || Host(`www.antaresprime.com`)
      - traefik.http.routers.home-page.entrypoints=websecure
      - traefik.http.services.home-page.loadbalancer.server.port=8080
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=1001,gid=1001
      - /var/run:uid=1001,gid=1001
      - /var/log/nginx:uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
