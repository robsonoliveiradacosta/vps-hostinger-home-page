# Dependabot: PR semanal quando sai versao nova das actions do deploy.yml
# (atualiza o SHA fixado e o comentario de versao) ou da imagem base do Dockerfile.
# Cooldown de 7 dias: versao recem-publicada espera antes de virar PR, porque
# release comprometido costuma ser descoberto nos primeiros dias.
# Merge do PR na main = deploy.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Minor impar do nginx e mainline (1.31); so patches da linha estavel.
      # Trocar de linha estavel (1.30 -> 1.32) e manual.
      - dependency-name: nginx
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope
